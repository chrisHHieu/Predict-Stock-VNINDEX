name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (lightgbm + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  modern:
    name: modern (mlflow, optuna, pandera, evidently, shap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          pip install -e ".[dev,modern]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  deep:
    name: deep (torch + chronos-2, no weights downloaded)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch and the deep extra
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,modern,deep]"
      - name: Test (the Chronos adapter is exercised with a fake pipeline)
        run: pytest -q tests/test_chronos.py tests/test_conformal.py
